name: Fix school formatting

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply formatting fixes
        run: |
          python - <<'PY'
          from pathlib import Path
          import re
          root=Path('.')
          skip={'.git','.next','node_modules'}
          for p in root.rglob('*'):
              if not p.is_file() or any(x in skip for x in p.parts): continue
              try: s=p.read_text(encoding='utf-8')
              except Exception: continue
              old=s
              for a,b in [('Kallyangaon','Kalyangaon'),('KALLYANGAON','KALYANGAON'),('Kallyangao','Kalyangaon'),('Kalyangao','Kalyangaon')]: s=s.replace(a,b)
              if p.as_posix()=='app/admin/results/page.tsx':
                  marker='const classes=useMemo(()=>Array.from(new Set(students.map(s=>s.class_name).filter(Boolean) as string[])).sort((a,b)=>a.localeCompare(b,undefined,{numeric:true})),[students])'
                  s=s.replace(marker,"const classes=['Nursery','LKG','UKG','Class 1','Class 2','Class 3','Class 4','Class 5','Class 6','Class 7','Class 8']")
                  old_date='<label>Exam Date<input type="date" value={examDate} onChange={e=>setExamDate(e.target.value)}/></label>'
                  new_date='<label>Exam Date<input type="text" inputMode="numeric" value={examDate ? fmtDate(examDate) : \'\'} onChange={e=>{const v=e.target.value.replace(/[^0-9]/g,\'\').slice(0,8); if(v.length===8){const d=v.slice(0,2),m=v.slice(2,4),y=v.slice(4,8); setExamDate(`${y}-${m}-${d}`)} else setExamDate(\'\')}} placeholder="dd/mm/yyyy" maxLength={10}/></label>'
                  s=s.replace(old_date,new_date)

                  # Bulk Results -> Marksheet must use the same professional marksheet design as the student profile.
                  if "import './marksheet-professional.css'" not in s:
                      s=s.replace("import './results.css'", "import './results.css'\nimport './marksheet-professional.css'")
                  if 'const [schoolBrand,setSchoolBrand]' not in s:
                      s=s.replace("const [examName,setExamName]=useState(''),[examDate,setExamDate]=useState(''),[className,setClassName]=useState('')", "const [examName,setExamName]=useState(''),[examDate,setExamDate]=useState(''),[className,setClassName]=useState('')\n const [schoolBrand,setSchoolBrand]=useState({name:'NEW SUNRISE PUBLIC SCHOOL',address:'Kalyangaon, Bihar – 854317',logo:''})")
                  old_load="async function load(){setLoading(true);const {data:a}=await supabase.auth.getSession();if(!a.session){window.location.href='/admin';return};const [{data:s,error:se},{data:r,error:re}]=await Promise.all([supabase.from('student_profiles').select('id,student_name,student_id,class_name,dob,father_name,student_photo_url').eq('status','active').order('student_name'),supabase.from('student_results').select('id,student_profile_id,result_set_id,exam_name,session,exam_date,subject,max_marks,marks,grade,percentage,remarks').order('exam_date',{ascending:false})]);if(se)setMessage(se.message);if(re)setMessage(re.message);setStudents((s||[]) as Student[]);setResults((r||[]) as ResultRow[]);setLoading(false)}"
                  new_load="async function load(){setLoading(true);const {data:a}=await supabase.auth.getSession();if(!a.session){window.location.href='/admin';return};const [{data:s,error:se},{data:r,error:re},{data:brand}]=await Promise.all([supabase.from('student_profiles').select('id,student_name,student_id,class_name,dob,father_name,student_photo_url').eq('status','active').order('student_name'),supabase.from('student_results').select('id,student_profile_id,result_set_id,exam_name,session,exam_date,subject,max_marks,marks,grade,percentage,remarks').order('exam_date',{ascending:false}),supabase.from('site_settings').select('key,value').in('key',['school_name','school_address','logo_url','school_logo'])]);if(se)setMessage(se.message);if(re)setMessage(re.message);const bm=Object.fromEntries((brand||[]).map((x:any)=>[x.key,x.value]));setSchoolBrand({name:bm.school_name||'NEW SUNRISE PUBLIC SCHOOL',address:bm.school_address||'Kalyangaon, Bihar – 854317',logo:bm.logo_url||bm.school_logo||''});setStudents((s||[]) as Student[]);setResults((r||[]) as ResultRow[]);setLoading(false)}"
                  s=s.replace(old_load,new_load)

                  start=s.find(' function printDoc(')
                  end=s.find(' function studentBlock(',start)
                  if start>=0 and end>start:
                      new_print=''' function printDoc(title:string,body:string,landscape=false){const w=window.open('','_blank','width=1100,height=900');if(!w){setMessage('Please allow pop-ups for Print / Download PDF.');return};const styleHtml=Array.from(document.querySelectorAll('link[rel="stylesheet"],style')).map((el:any)=>el.tagName.toLowerCase()==='link'?`<link rel="stylesheet" href="${esc((el as HTMLLinkElement).href)}">`:el.outerHTML).join('');w.document.open();w.document.write(`<!doctype html><html><head><meta charset="utf-8"><base href="${esc(window.location.origin)}/"><title>${esc(title)}</title>${styleHtml}<style>@page{size:A4 ${landscape?'landscape':'portrait'};margin:6mm}html,body{margin:0!important;padding:0!important;background:#fff!important}body{font-family:Arial,Helvetica,sans-serif}.bulkPrintSheet{width:100%;display:block;page-break-after:always;break-after:page}.bulkPrintSheet:last-child{page-break-after:auto;break-after:auto}.proMarksheet{width:100%!important;max-width:none!important;margin:0!important;box-shadow:none!important;page-break-after:avoid!important;break-after:avoid!important;overflow:hidden!important}.proMarksheet *{box-sizing:border-box!important;print-color-adjust:exact;-webkit-print-color-adjust:exact}.proDetails{display:grid!important;grid-template-columns:1fr 125px!important;gap:12px!important}.proDetailsGrid{display:grid!important;grid-template-columns:1fr 1fr!important;gap:0 15px!important}.proPhotoBox{display:block!important;align-self:start!important}.proPhoto{width:108px!important;height:122px!important;object-fit:cover!important;display:block!important;margin:0 auto!important}.proPhotoPlaceholder{width:108px!important;height:122px!important;display:grid!important;place-items:center!important;margin:0 auto!important}.proPhotoCaption{display:block!important}.proHeader{padding:6mm 2mm 4mm!important}.proSchoolName{font-size:24px!important}.proSchoolAddress{font-size:10px!important}.proDetail{font-size:11px!important}.proDetail b{font-size:9px!important;min-width:96px!important}.proExamItem{font-size:11px!important}.proExamItem b{font-size:8px!important}.proExamItem strong{font-size:11px!important}.proMarksTable th{font-size:9px!important;padding:2.5mm 1.5mm!important}.proMarksTable td{font-size:10px!important;padding:2.2mm 1.5mm!important}.proSummaryCard b{font-size:8px!important}.proSummaryCard strong{font-size:15px!important}.proResultNotice{font-size:10px!important}.proFooter{margin-top:4mm!important}.proFooterBar{font-size:8px!important}@media print{html,body{width:100%!important;overflow:hidden!important}.bulkPrintSheet{page-break-after:always!important;break-after:page!important}.bulkPrintSheet:last-child{page-break-after:auto!important;break-after:auto!important}.proMarksheet{page-break-after:avoid!important;break-after:avoid!important}}</style></head><body>${body}<script>window.onload=()=>setTimeout(()=>window.print(),500)</script></body></html>`);w.document.close()}\n'''
                      s=s[:start]+new_print+s[end:]

                  start=s.find(' function marksheetHtml()')
                  end=s.find(' function admitHtml()',start)
                  if start>=0 and end>start:
                      new_sheet=''' function marksheetHtml(){return selectedGroups.map((g,index)=>{const cleanRows=g.rows||[];const full=cleanRows.reduce((n,r)=>n+Number(r.max_marks||0),0);const obtained=cleanRows.reduce((n,r)=>n+Number(r.marks||0),0);const percentage=full?obtained/full*100:0;const failed=cleanRows.filter(r=>pct(Number(r.max_marks),Number(r.marks))<30);const final=failed.length?'FAIL':'PASS';const badge=final==='PASS'?'pass':'fail';const photo=g.student.student_photo_url?`<img class="proPhoto" src="${esc(g.student.student_photo_url)}" alt="Student Photo">`:`<div class="proPhotoPlaceholder">PHOTO</div>`;const logo=schoolBrand.logo?`<img class="proLogo" src="${esc(schoolBrand.logo)}" alt="School Logo">`:`<div class="proLogoFallback">NSPS</div>`;const rows=cleanRows.map((r,i)=>{const p=pct(Number(r.max_marks),Number(r.marks));const rr=p>=30?'PASS':'FAIL';return `<tr class="${rr==='FAIL'?'subjectFail':''}"><td>${i+1}</td><td>${esc(r.subject)}</td><td>${Number(r.max_marks)}</td><td>${Number(r.marks)}</td><td>${p.toFixed(2)}%</td><td>${esc(r.grade||grade(p))}</td><td class="${rr==='PASS'?'resultPass':'resultFail'}">${rr}</td></tr>`}).join('');return `<section class="bulkPrintSheet"><div class="proMarksheet"><div class="proHeader"><div class="proLogoWrap">${logo}</div><div class="proSchool"><p class="proSchoolName">${esc(schoolBrand.name)}</p><p class="proSchoolAddress">${esc(schoolBrand.address)}</p><p class="proSchoolMotto">KNOWLEDGE • CHARACTER • A BRIGHTER FUTURE</p></div><div class="proResultBadge ${badge}"><strong>${final}</strong><span>${final==='PASS'?'✓':'×'}</span></div></div><div class="proStatement">STATEMENT OF MARKS</div><div class="proExamBar"><div class="proExamItem"><b>Exam Name</b><strong>${esc(g.exam_name)}</strong></div><div class="proExamItem"><b>Date of Exam</b><strong>${esc(dateText(g.exam_date))}</strong></div><div class="proExamItem"><b>Session</b><strong>${esc(g.session)}</strong></div><div class="proExamItem"><b>Final Result</b><strong class="${final==='PASS'?'textPass':'textFail'}">${final}</strong></div></div><div class="proDetailsTitle">STUDENT DETAILS</div><div class="proDetails"><div class="proDetailsGrid"><div class="proDetail"><b>Student Name</b>${esc(g.student.student_name)}</div><div class="proDetail"><b>Student ID</b>${esc(g.student.student_id||'—')}</div><div class="proDetail"><b>Father's Name</b>${esc(g.student.father_name||'—')}</div><div class="proDetail"><b>Class</b>${esc(g.student.class_name||'—')}</div><div class="proDetail"><b>Date of Birth</b>${esc(dateText(g.student.dob))}</div><div class="proDetail"><b>Roll Number</b>${esc(g.roll)}</div></div><div class="proPhotoBox">${photo}<span class="proPhotoCaption">STUDENT PHOTO</span></div></div><div class="proSectionTitle">SUBJECT WISE MARKS</div><div class="proMarksWrap"><table class="proMarksTable"><thead><tr><th>S.No.</th><th>Subject</th><th>Full Marks</th><th>Obtained</th><th>Percentage</th><th>Grade</th><th>Result</th></tr></thead><tbody>${rows||'<tr><td colspan="7">No marks entered</td></tr>'}</tbody></table></div><div class="proSummary"><div class="proSummaryCard"><b>Total Full Marks</b><strong>${full}</strong></div><div class="proSummaryCard"><b>Total Obtained</b><strong>${obtained}</strong></div><div class="proSummaryCard"><b>Overall Percentage</b><strong>${percentage.toFixed(2)}%</strong></div><div class="proSummaryCard"><b>Overall Grade</b><strong>${grade(percentage)}</strong></div><div class="proSummaryCard ${badge}"><b>Final Result</b><strong>${final}</strong></div></div><div class="proResultNotice ${badge}"><strong>${final==='PASS'?'Congratulations! Student has passed all subjects.':`Student has failed in ${failed.length} subject${failed.length>1?'s':''}.`}</strong></div><div class="proFooter"><div class="proSign"><div class="proSignLine"></div><b>Class Teacher</b><span>Signature</span></div><div class="proStamp">${esc(schoolBrand.name)}<br>OFFICIAL SCHOOL SEAL<br>AUTHORIZED</div><div class="proSign"><div class="proSignLine"></div><b>Principal</b><span>Signature</span></div></div><div class="proFooterBar">BETTER EDUCATION • BRIGHTER TOMORROW</div></div></section>`}).join('')}\n'''
                      s=s[:start]+new_sheet+s[end:]

              if p.as_posix()=='app/admin/page.tsx':
                  s=s.replace('onClick={()=>setTab(\'admissions\')}><span className="actionIcon">🎓</span><span className="actionText"><b>Admissions</b>', 'onClick={()=>window.location.href="/admin/admissions"}><span className="actionIcon">🎓</span><span className="actionText"><b>Admissions</b>')
                  s=s.replace('onClick={()=>setTab(\'admissions\')}><span className="actionIcon">👨‍🎓</span><span className="actionText"><b>Approved Students</b>', 'onClick={()=>window.location.href="/admin/students"}><span className="actionIcon">👨‍🎓</span><span className="actionText"><b>Approved Students</b>')
                  s=s.replace('onClick={()=>setTab(\'admissions\')}><span className="actionIcon">🗂️</span><span className="actionText"><b>Application History</b>', 'onClick={()=>window.location.href="/admin/admissions"}><span className="actionIcon">🗂️</span><span className="actionText"><b>Application History</b>')
                  s=s.replace('onClick={()=>setTab(\'admissions\')}><span className="actionIcon">💰</span><span className="actionText"><b>Fees Management</b>', 'onClick={()=>window.location.href="/admin/fees"}><span className="actionIcon">💰</span><span className="actionText"><b>Fees Management</b>')
                  s=s.replace('onClick={()=>setTab(\'admissions\')}><span className="actionIcon">📊</span><span className="actionText"><b>Results</b>', 'onClick={()=>window.location.href="/admin/results"}><span className="actionIcon">📊</span><span className="actionText"><b>Results</b>')
                  s=s.replace('onClick={()=>setTab(\'admissions\')}><span className="actionIcon">📅</span><span className="actionText"><b>Attendance</b>', 'onClick={()=>window.location.href="/admin/attendance"}><span className="actionIcon">📅</span><span className="actionText"><b>Attendance</b>')
              if p.as_posix()=='app/admin/layout.tsx':
                  if 'StudentProfileDeleteButton' not in s:
                      s=s.replace("import {supabase} from '../../lib/supabase'", "import {supabase} from '../../lib/supabase'\nimport StudentProfileDeleteButton from './StudentProfileDeleteButton'")
                  if '<StudentProfileDeleteButton/>' not in s:
                      s=s.replace('<DashboardCardLinks/><EnhanceMarksheet/>','<DashboardCardLinks/><EnhanceMarksheet/><StudentProfileDeleteButton/>')
              if s!=old: p.write_text(s,encoding='utf-8')
          PY
      - name: Commit fixes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then echo "No changes"; else git commit -m "Fix bulk marksheet professional print design"; git push; fi
