name: Fix school formatting

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply formatting fixes
        run: |
          python - <<'PY'
          from pathlib import Path
          import re
          root = Path('.')
          skip = {'.git', '.next', 'node_modules'}
          for p in root.rglob('*'):
              if not p.is_file() or any(x in skip for x in p.parts):
                  continue
              try:
                  s = p.read_text(encoding='utf-8')
              except Exception:
                  continue
              old = s
              for a,b in [('Kallyangaon','Kalyangaon'),('KALLYANGAON','KALYANGAON'),('Kallyangao','Kalyangaon'),('Kalyangao','Kalyangaon')]:
                  s = s.replace(a,b)
              if p.as_posix() == 'app/admin/results/page.tsx':
                  marker='const classes=useMemo(()=>Array.from(new Set(students.map(s=>s.class_name).filter(Boolean) as string[])).sort((a,b)=>a.localeCompare(b,undefined,{numeric:true})),[students])'
                  replacement="const classes=['Nursery','LKG','UKG','Class 1','Class 2','Class 3','Class 4','Class 5','Class 6','Class 7','Class 8']"
                  s=s.replace(marker,replacement)
                  old_date='<label>Exam Date<input type="date" value={examDate} onChange={e=>setExamDate(e.target.value)}/></label>'
                  new_date='<label>Exam Date<input type="text" inputMode="numeric" value={examDate ? fmtDate(examDate) : \'\'} onChange={e=>{const v=e.target.value.replace(/[^0-9]/g,\'\').slice(0,8); if(v.length===8){const d=v.slice(0,2),m=v.slice(2,4),y=v.slice(4,8); setExamDate(`${y}-${m}-${d}`)} else setExamDate(\'\')}} placeholder="dd/mm/yyyy" maxLength={10}/></label>'
                  s=s.replace(old_date,new_date)
              if p.as_posix() == 'app/admin/page.tsx':
                  pattern=r'(<button className="dashboardActionCard featured" )onClick=\{\(\)=>setTab\(\'admissions\'\)\}'
                  s=re.sub(pattern,r'\1onClick={()=>window.location.href="/admin/admissions"}',s)
                  pattern2=r'(<button className="dashboardActionCard" )onClick=\{\(\)=>setTab\(\'admissions\'\)\}(<span className="actionIcon">👨‍🎓</span><span className="actionText"><b>Approved Students</b>)'
                  s=re.sub(pattern2,r'\1onClick={()=>window.location.href="/admin/students"}\2',s)
                  pattern3=r'(<button className="dashboardActionCard" )onClick=\{\(\)=>setTab\(\'admissions\'\)\}(<span className="actionIcon">🗂️</span><span className="actionText"><b>Application History</b>)'
                  s=re.sub(pattern3,r'\1onClick={()=>window.location.href="/admin/admissions"}\2',s)
              if p.as_posix() == 'app/admin/layout.tsx':
                  if "StudentProfileDeleteButton" not in s:
                      s=s.replace("import {supabase} from '../../lib/supabase'", "import {supabase} from '../../lib/supabase'\nimport StudentProfileDeleteButton from './StudentProfileDeleteButton'")
                  s=s.replace('return null}</div>', 'return null}</div>')
                  if '<StudentProfileDeleteButton/>' not in s:
                      s=s.replace('<DashboardCardLinks/><EnhanceMarksheet/>', '<DashboardCardLinks/><EnhanceMarksheet/><StudentProfileDeleteButton/>')
              if s != old:
                  p.write_text(s, encoding='utf-8')
          PY
      - name: Commit fixes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No changes"
          else
            git commit -m "Connect admissions workflow and student deletion"
            git push
          fi
