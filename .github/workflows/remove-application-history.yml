name: Remove application history dashboard card

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Fix dashboard
        run: |
          python - <<'PY'
          from pathlib import Path
          import re
          p=Path('app/admin/page.tsx')
          s=p.read_text(encoding='utf-8')
          old=s
          # Approved Students must count actual active student profiles, so deleting a student immediately reduces the count.
          s=re.sub(r"const stats=useMemo\(\(\)=>\[.*?\],\[[^\n]*\]\)", "const stats=useMemo(()=>[{label:'Pending Applications',value:admissions.filter(a=>['pending','new'].includes(String(a.status||'pending').toLowerCase())).length},{label:'Approved Students',value:students.filter(s=>s.status==='active').length},{label:'Total Applications',value:admissions.length}],[admissions,students])", s, count=1, flags=re.S)
          # Remove the obsolete Application History card completely.
          s=re.sub(r'<button className="dashboardActionCard"[^>]*>\s*<span className="actionIcon">🗂️</span>\s*<span className="actionText"><b>Application History</b>.*?</button>', '', s, count=1, flags=re.S)
          s=s.replace('10 MANAGEMENT AREAS','9 MANAGEMENT AREAS')
          if s!=old: p.write_text(s,encoding='utf-8')
          PY
          rm -f app/admin/attendance/LOCK_NOTE.txt TEST.txt TEST2.txt TEST3.txt TEST4.txt
      - name: Commit fixes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Fix approved student count and remove application history"
          git push
